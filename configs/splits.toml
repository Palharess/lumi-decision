# Splits e grupos reservados para generalização.
# Regra: nada marcado como reservado (held_out) entra em treino, seleção de prompt ou calibração.
# Os splits "test" oficiais dos datasets não são usados para nenhuma escolha.
# Mudar este arquivo muda a versão dos splits: incremente `salt` ao alterar qualquer valor.

salt = "lumi-decision-splits-v2"

[felhen]
# Tarefas inteiras reservadas (proposta inicial; confirmar com o time de benchmark).
held_out_tasks = ["juristcu_area", "factck_veracidade"]
# Linhas tiradas do treino oficial de cada tarefa vista para ajustar temperatura/limiares.
calib_per_task = 200

[telepatia]
# Workflow inteiro reservado.
held_out_workflows = ["invoice_processing"]
# Divisão dos estados de treino dos workflows vistos (o resto vai para treino).
dev_frac = 0.10
calib_frac = 0.10

[traces]
# Tipos de ferramenta reservados: casos cuja ferramenta correta é desses tipos são held_out,
# e as ferramentas desses tipos nunca aparecem como distratoras em casos de treino.
held_out_tipos = ["viagens", "saude"]
# Fração dos casos de treino vistos que vai para calibração (sorteio por texto).
calib_frac = 0.10
# Tamanho do menu: ferramenta correta (se houver) + distratoras + "no_tool".
menu_size = 5

[f3]
# Piloto de diversidade (analises/f3_fontes.md). Seção nova com sal próprio: as seções acima não mudaram,
# então o `salt` global continua o mesmo. Famílias reservadas registradas em 14/11/2026, antes de qualquer treino.
salt = "lumi-decision-f3-v1"
held_out_families = ["pss_mais_simples"]
dev_frac = 0.10
calib_frac = 0.10

[res2]
# Reservadas v2 (analises/reservadas_v2.md): famílias programáticas com gabarito por construção, todas reservadas.
# Seção nova com sal próprio: as seções acima não mudam. As famílias só valem como reservadas depois do registro
# (auditoria de atalhos + fatia de dificuldade com o Lumi congelado), anotado em analises/reservadas_v2.md.
salt = "lumi-decision-res2-v1"
familias = ["restricoes_oferta", "regra_beneficio", "custo_plano", "ordem_eventos"]
grupos_por_familia = 650
grupos_dificuldade = 50

[res2.sal_por_familia]
# Ajuste 1 (15/11/2026): `restricoes_oferta` falhou no filtro de dificuldade (Lumi congelado 192/200, acima de 90%).
# Gerador ajustado (4-5 condições, numéricas indiretas, categorias negativas) e fatia nova com este sal.
restricoes_oferta = "lumi-decision-res2-v1-ajuste1"
